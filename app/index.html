<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marlin Coast Cover Studio</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="studio">
  <section class="controls" aria-label="Cover controls">
    <h1>Marlin Coast<br>Cover Studio</h1>
    <p class="lede">Your photo and a caption, made into a multi-panel coastal-noir cover. Everything stays on this machine.</p>

    <h2>1 · Photo</h2>
    <p class="hint">Pick a panel, then give it a photo of your own — or fill every panel with it.</p>
    <div id="panelList" class="chip-row" role="group" aria-label="Panels"></div>
    <label class="file-label">Photo for <span id="selectedPanelName">THE NIGHT DJ</span>
      <input id="photoFile" type="file" accept="image/*">
    </label>
    <div class="button-row">
      <button id="fillAllBtn" type="button">Fill every panel with it</button>
      <button id="resetPanelBtn" type="button">Reset panel</button>
    </div>
    <label>Crop zoom <input id="zoomRange" type="range" min="1" max="2.6" step="0.01" value="1"></label>
    <label>Shift left / right <input id="xRange" type="range" min="-0.45" max="0.45" step="0.01" value="0"></label>
    <label>Shift up / down <input id="yRange" type="range" min="-0.45" max="0.45" step="0.01" value="0"></label>

    <h2>2 · Layout &amp; grade</h2>
    <div id="layoutRow" class="chip-row" role="group" aria-label="Layouts"></div>
    <div id="gradeRow" class="chip-row" role="group" aria-label="Grades"></div>

    <h2>3 · Words</h2>
    <label>Title <input id="titleInput" type="text" maxlength="24" value="MARLIN COAST"></label>
    <label>Caption <input id="captionInput" type="text" maxlength="64" value="FIVE FACES · ONE COASTLINE · NO WAY BACK"></label>

    <h2>4 · Export</h2>
    <label>Post size
      <select id="sizeSelect">
        <option value="square">Square · 1080 × 1080</option>
        <option value="portrait">Portrait · 1080 × 1350</option>
        <option value="wide">Wide · 1920 × 1080</option>
      </select>
    </label>
    <button id="exportBtn" class="export" type="button">Export PNG</button>
    <p id="statusLine" role="status"></p>
  </section>
  <section class="stage" aria-label="Cover preview">
    <canvas id="coverCanvas" width="1080" height="1080"></canvas>
  </section>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
